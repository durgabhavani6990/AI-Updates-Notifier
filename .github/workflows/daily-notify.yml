name: Daily AI Updates Notifier

on:
  # No `schedule:` trigger here on purpose. GitHub deprioritizes
  # schedule-triggered runs specifically in its shared runner queue, which is
  # what caused a "job was not acquired by Runner ... after multiple
  # attempts" failure on this workflow. workflow_dispatch runs (manual or via
  # API) get normal queue priority, so the daily trigger is an external free
  # cron service calling this over the API instead -- see DEPLOY.md's "Daily
  # scheduling" section.
  workflow_dispatch: {}  # also lets you trigger it manually from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          META_WA_PHONE_NUMBER_ID: ${{ secrets.META_WA_PHONE_NUMBER_ID }}
          META_WA_ACCESS_TOKEN: ${{ secrets.META_WA_ACCESS_TOKEN }}
          META_WA_TEMPLATE_NAME: ${{ secrets.META_WA_TEMPLATE_NAME }}
          META_WA_TEMPLATE_LANG: ${{ secrets.META_WA_TEMPLATE_LANG }}
          RECIPIENT_WHATSAPP_NUMBERS: ${{ secrets.RECIPIENT_WHATSAPP_NUMBERS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "ai-updates-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update seen-updates state [skip ci]"
          git push
